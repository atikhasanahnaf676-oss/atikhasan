<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheAtik</title>
    
    <!-- Kursor CSS -->
    <link rel="stylesheet" href="https://unpkg.com/kursor/dist/kursor.css">
    
    <!-- Main Style CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Custom Car Mouse Cursor Container -->
    <div class="custom-cursor" id="cursorContainer">
        <div class="cursor-car"></div>
    </div>

    <!-- Grain Overlay -->
    <div class="grain"></div>

    <!-- =========================
         NAVBAR
    ========================== -->
    <header>
        <div class="logo">atik<b>.</b></div>

        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#journey">Journey</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><a href="#blog">Blog</a></li>
            </ul>
        </nav>
    </header>

    <!-- =========================
         HERO SECTION
    ========================== -->
    <section class="hero" id="home">
        <div class="hero-content">

            <!-- Profile Image -->
            <div class="profile-wrapper">
                <img src="profile.png" alt="The Atik" class="profile-photo">
                <div class="profile-frame"></div>
            </div>

            <h1>The Atik</h1>
            <p class="subtitle">Teacher & Web Developer</p>

            <!-- Stats -->
            <div class="stats">
                <div class="stat-box">
                    <h2>00</h2>
                    <p>YouTube Subscribers</p>
                </div>
                <div class="stat-box">
                    <h2>00</h2>
                    <p>Learners Helped</p>
                </div>
                <div class="stat-box">
                    <h2>00</h2>
                    <p>YouTube Videos</p>
                </div>
                <div class="stat-box">
                    <h2>00+</h2>
                    <p>Years Experience</p>
                </div>
            </div>

        </div>
    </section>

    <!-- Other Sections -->
    <section id="about"></section>
    <section id="journey"></section>
    <section id="contact"></section>
    <section id="blog"></section>

    <!-- JS File Connected Here -->
    <script src="cursor-fix.js"></script>
</body>
</html>
